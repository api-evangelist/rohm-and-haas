name: Rohm and Haas
description: |
  Rohm and Haas Company was an American specialty chemicals manufacturer
  founded in 1909 and headquartered in Philadelphia, Pennsylvania. The
  company produced electronic materials, specialty polymers, adhesives,
  coatings, paints, and process chemicals. On April 1, 2009, Rohm and Haas
  was acquired by The Dow Chemical Company for approximately $18.8 billion
  in cash and stock. The Rohm and Haas brand has since been largely retired
  and its product lines, technologies, and businesses have been integrated
  into Dow (now Dow Inc., NYSE: DOW). Some legacy product brands persist
  under Dow but the standalone company no longer exists.
